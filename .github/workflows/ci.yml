name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Prettier — markdown formatting
        run: npx --yes prettier@latest --check '**/*.md'

      - name: Markdown link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          # gnu.org refuses the checker's requests (status 0) though the
          # license URLs are alive — ignored via the config file.
          config-file: .github/markdown-link-check.json
  alarm:
    runs-on: ubuntu-latest
    needs: [lint]
    if: failure()
    steps:
      - name: Tell Slack the pipeline went red
        continue-on-error: true
        env:
          HOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: |
          [ -z "$HOOK" ] && exit 0
          jq -n --arg t ":rotating_light: *The poster wall went crooked* — the pipeline went red on \`${GITHUB_REF_NAME}\`. _gmrdad82 · <https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}|run> · \`${GITHUB_SHA:0:7}\`_" '{text: $t}' | curl -sS -X POST -H 'Content-type: application/json' -d @- "$HOOK"
