name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  pull_request:
    paths-ignore:
      - "README.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Prettier — markdown formatting
        run: npx --yes prettier@3.9.9 --check '**/*.md'

      - name: Markdown link check
        uses: tcort/github-action-markdown-link-check@e7c7a18363c842693fadde5d41a3bd3573a7a225
        with:
          use-quiet-mode: "yes"
          # gnu.org refuses the checker's requests (status 0) though the
          # license URLs are alive — ignored via the config file.
          config-file: .github/markdown-link-check.json
